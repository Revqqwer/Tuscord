<!doctype html>
<html><head><meta charset="utf-8"><title>Tuscord Intro</title>
<style>
@font-face{font-family:PJ;font-weight:500;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:PJ;font-weight:500;src:url(fonts/plus-jakarta-sans-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F}
@font-face{font-family:PJ;font-weight:800;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:PJ;font-weight:800;src:url(fonts/plus-jakarta-sans-latin-ext-800-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F}
html,body{margin:0;background:#0a0b0d;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
 * Tuscord intro — "bir yazma noktası topluluğa dönüşür".
 * Her şey seek(t) içinde t'den hesaplanır: zamanlayıcı, CSS animasyonu,
 * kareler arası durum yok. 120 BPM: vuruş = 0,5 sn, ölçü = 2 sn, toplam 15 sn.
 */
const W = 1920, H = 1080, CX = 960, CY = 540, DUR = 15;
const BG = '#0a0b0d', TQ = '#14b8a6', AM = '#faa81a', CO = '#f0616d', WH = '#f4f5f7';
const cv = document.getElementById('c'), x = cv.getContext('2d');
const F = (w, s) => `${w} ${s}px PJ`;

// ---------- zaman yardımcıları ----------
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const ex = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);           // üstel çıkış
const exIn = p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, 10 * p - 10);          // üstel giriş
const exIO = p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2;
// Kritik sönümlü yay: hedefi aşmaz (zıplama yok).
const spring = (dt, w = 16) => dt <= 0 ? 0 : 1 - (1 + w * dt) * Math.exp(-w * dt);
const DT = 1 / 120;

// Hız yönünde bulanıklık: pos(t) ile pos(t-DT) arasındaki yol boyunca iz kopyaları.
function smear(posFn, t, draw) {
  const p = posFn(t), q = posFn(t - DT);
  const vx = p.x - q.x, vy = p.y - q.y, d = Math.hypot(vx, vy);
  const n = Math.min(10, Math.floor(d / 6));
  if (n >= 1) {
    x.save();
    for (let k = n; k >= 1; k--) {
      x.globalAlpha = 0.5 / (n + 1) * (1 - k / (n + 2)) * 2;
      draw(p.x - vx * k / n * 1.6, p.y - vy * k / n * 1.6, p);
    }
    x.restore();
  }
  draw(p.x, p.y, p);
}
function rr(px, py, w, h, r) { x.beginPath(); x.roundRect(px, py, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function disc(px, py, r, col) { if (r <= 0) return; x.fillStyle = col; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill(); }
function text(s, px, py, size, col, w = 800, align = 'center', base = 'middle') {
  x.font = F(w, size); x.fillStyle = col; x.textAlign = align; x.textBaseline = base; x.fillText(s, px, py);
}

// ---------- 1. ölçü: kanca (0–2) ----------
function bar1(t) {
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  if (t < 1) {
    const s = 76 * spring(t - .02, 18), r = 28 - 6 * spring(t - .02, 18);
    for (let i = 0; i < 3; i++) {
      const wave = t < .5 ? 0 : 18 * Math.max(0, Math.sin(Math.PI * ((t - .5) * 4 - i * .45)));
      disc(CX + (i - 1) * s, CY - wave * 1.6, i === 1 || t > .03 ? r : 0, TQ);
    }
    return;
  }
  // balon: noktalar uzayıp birleşir
  const p = ex(seg(t, 1, 1.38));
  const bw = lerp(200, 820, p), bh = lerp(44, 220, p);
  const push = exIn(seg(t, 1.74, 2));                 // balonun içinden geçiş
  const sc = 1 + push * 16;
  x.save(); x.translate(CX, CY); x.scale(sc, sc);
  x.fillStyle = TQ; rr(-bw / 2, -bh / 2, bw, bh, lerp(22, 64, p)); x.fill();
  // kuyruk
  x.beginPath(); x.moveTo(-bw / 2 + 40, bh / 2 - 2); x.lineTo(-bw / 2 + 40 - 50 * p, bh / 2 + 50 * p); x.lineTo(-bw / 2 + 120, bh / 2 - 2); x.fill();
  // içteki noktalar küçülerek kaybolur (ölçekle, fade yok)
  const dr = 16 * (1 - ex(seg(t, 1.05, 1.35)));
  for (let i = 0; i < 3; i++) disc((i - 1) * 56 * (1 - p * .3), 0, dr, BG);
  // "selam" yazılır
  const n = Math.floor(seg(t, 1.42, 1.72) * 5.999);
  if (t >= 1.42) {
    x.font = F(800, 124); const full = x.measureText('selam').width;
    text('selam'.slice(0, n + 1), -full / 2, 6, 124, BG, 800, 'left');
    // imleç
    if (t < 1.74) { x.fillStyle = BG; const cw = x.measureText('selam'.slice(0, n + 1)).width; x.fillRect(-full / 2 + cw + 10, -52, 9, 110); }
  }
  x.restore();
}

// ---------- 2. ölçü: kinetik yazı (2–4) ----------
const WORDS = [['YAZ.', 'down'], ['KONUŞ.', 'left'], ['PAYLAŞ.', 'stretch'], ['BULUŞ.', 'up']];
function letterPos(word, dir, tl, k, n, width, cxs) {
  // tl: kelime başlangıcından beri geçen süre
  const pe = ex(seg(tl, k * .028, k * .028 + .3));
  const last = word === 'BULUŞ.';
  const po = last ? 0 : exIn(seg(tl, .34, .5));  // eski kelime yenisi gelmeden çıkar
  let dx = 0, dy = 0, sx = 1;
  if (dir === 'down') { dy = -(1 - pe) * 340 + po * 340; }
  if (dir === 'left') { dx = (1 - pe) * 900 - po * 1100; }
  if (dir === 'stretch') { sx = pe; dy = po * -340; }
  if (dir === 'up') { dy = (1 - pe) * 340; }
  return { x: cxs + dx, y: CY + dy, sx };
}
function bar2(t) {
  x.fillStyle = TQ; x.fillRect(0, 0, W, H);
  x.save(); x.beginPath(); x.rect(0, CY - 170, W, 340); x.clip();
  WORDS.forEach(([word, dir], i) => {
    const t0 = 2 + i * .5, tl = t - t0;
    if (tl < 0 || tl > .5) return;
    if (word === 'BULUŞ.' && t > 3.72) return;
    x.font = F(800, 300);
    const ws = [...word].map(ch => x.measureText(ch).width), tot = ws.reduce((a, b) => a + b, 0);
    let acc = CX - tot / 2;
    [...word].forEach((ch, k) => {
      const cxs = acc + ws[k] / 2; acc += ws[k];
      smear(tt => letterPos(word, dir, tt - t0, k, word.length, tot, cxs), t, (px, py, p) => {
        if (p.sx <= .01) return;
        x.save(); x.translate(px, py); x.scale(p.sx, 1); text(ch, 0, 10, 300, BG); x.restore();
      });
    });
  });
  x.restore();
  // BULUŞ. tek siyah çizgiye ezilir, sonra çizgi siyah bandı açar
  if (t > 3.72) {
    x.font = F(800, 300); const tot = x.measureText('BULUŞ.').width;
    const sq = ex(seg(t, 3.72, 3.88));
    const lineW = lerp(tot, 1200, ex(seg(t, 3.8, 4)));
    const band = exIO(seg(t, 3.86, 4.1));
    if (sq < 1) {
      x.save(); x.translate(CX, CY); x.scale(1, 1 - sq * .985); text('BULUŞ.', 0, 10, 300, BG); x.restore();
    }
    const bh = lerp(6, H + 40, band);
    x.fillStyle = BG; x.fillRect(0, CY - bh / 2, W, bh);
    if (band > 0) { x.fillStyle = WH; x.fillRect(CX - lineW / 2, CY - 3, lineW, 6); }
  }
}

// ---------- 3. ölçü: şekil dönüşümü (4–6) ----------
const NB = 28;
function barH(i, t) {
  const bt = t * 2 - Math.floor(t * 2), env = .35 + .65 * Math.exp(-6 * bt);
  return 40 + 230 * env * (.3 + .7 * Math.abs(Math.sin(i * 1.7 + Math.floor(t * 4) * 2.3)));
}
const tri = k => ({ x: CX + Math.cos(-Math.PI / 2 + k * 2.0944) * 230, y: CY + 20 + Math.sin(-Math.PI / 2 + k * 2.0944) * 230 });
const NODE_COL = [TQ, AM, CO, TQ, AM, CO], NODE_L = ['A', 'E', 'K', 'D', 'S', 'M'];
function bar3(t) {
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  if (t < 5.02) {
    const grow = ex(seg(t, 4, 4.22)), m = ex(seg(t, 4.5, 4.88)), retract = ex(seg(t, 4.86, 5.02));
    for (let i = 0; i < NB; i++) {
      const lx = CX - 600 + i * (1200 / (NB - 1));
      const th = -Math.PI / 2 + i / NB * Math.PI * 2;
      let h = lerp(6, barH(i, t), grow);
      h = lerp(h, 34 + .25 * barH(i, t), m) * (1 - retract);
      const rx = CX + Math.cos(th) * (190 + h / 2), ry = CY + 20 + Math.sin(th) * (190 + h / 2);
      const px = lerp(lx, rx, m), py = lerp(CY, ry, m), rot = lerp(0, th + Math.PI / 2, m);
      const wdt = lerp(lerp(1200 / NB + 2, 14, grow), 14, m);
      x.save(); x.translate(px, py); x.rotate(rot); x.fillStyle = grow < 1 ? WH : TQ; rr(-wdt / 2, -h / 2, wdt, Math.max(h, 6), 7); x.fill(); x.restore();
    }
    if (retract > 0) disc(CX, CY + 20, 190 * ex(seg(t, 4.88, 5.1)), TQ);
    return;
  }
  // dolu avatar → üçe ayrılır
  const fill = ex(seg(t, 4.88, 5.1));
  const split = spring(t - 5.2, 14);
  const r = lerp(190 * fill, 110, ex(seg(t, 5.15, 5.45)));
  // bağlantılar
  const lk = ex(seg(t, 5.55, 5.85));
  if (lk > 0) {
    x.strokeStyle = WH; x.lineWidth = 5; x.lineCap = 'round';
    for (let a = 0; a < 3; a++) { const b = (a + 1) % 3, A = tri(a), B = tri(b);
      x.beginPath(); x.moveTo(A.x, A.y); x.lineTo(lerp(A.x, B.x, lk), lerp(A.y, B.y, lk)); x.stroke(); }
  }
  for (let k = 2; k >= 0; k--) {
    smear(tt => { const s = spring(tt - 5.2, 14), T = tri(k); return { x: lerp(CX, T.x, s), y: lerp(CY + 20, T.y, s) }; }, t, (px, py) => disc(px, py, r, NODE_COL[k]));
  }
  for (let k = 0; k < 3; k++) {
    const T = tri(k), s = spring(t - 5.5 - k * .06, 18);
    if (s > .01) { x.save(); x.translate(T.x, T.y); x.scale(s, s); text(NODE_L[k], 0, 6, 96, BG); x.restore(); }
  }
  // konuşan halka (5.75 vuruşunda)
  const ring = seg(t, 5.75, 6);
  if (ring > 0 && split > .9) { const T = tri(0); x.strokeStyle = TQ; x.lineWidth = 8; x.beginPath(); x.arc(T.x, T.y, 110 + 10 + 18 * ex(ring), 0, 7); x.stroke(); }
}

// ---------- 4. ölçü: 2D → 3D mesh (6–8) ----------
function nodes3d(t) {
  const out = [];
  for (let k = 0; k < 6; k++) {
    const a = -Math.PI / 2 + (k < 3 ? k * 2.0944 : (k - 3) * 2.0944 + 1.0472);
    const rad = k < 3 ? 230 : 390;
    const z = k < 3 ? 0 : -210 * spring(t - 6.5 - (k - 3) * .08, 13);
    out.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad + 20, z, k, on: k < 3 || t > 6.5 + (k - 3) * .08 });
  }
  return out;
}
function project(n, tilt, spin) {
  // önce düzlem normali (z) etrafında dönüş, sonra X ekseninde yatma
  const cs = Math.cos(spin), sn = Math.sin(spin);
  let px = n.x * cs - n.y * sn, py = n.x * sn + n.y * cs, pz = n.z;
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const y2 = py * ct - pz * st, z2 = py * st + pz * ct;
  const f = 1500, s = f / (f + z2);
  return { x: CX + px * s, y: CY + y2 * s, s, z: z2 };
}
const SIDE = k => ({ x: 92, y: 170 + k * 126 });
function bar4(t) {
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  const tilt = 1.08 * ex(seg(t, 6, 6.42)) * (1 - ex(seg(t, 7.5, 7.85)));
  const spin = 2.0944 * exIO(seg(t, 7, 7.5));
  const flat = ex(seg(t, 7.5, 7.92));
  const ns = nodes3d(t).filter(n => n.on);
  const P = ns.map(n => {
    const p = project(n, tilt, spin), S = SIDE(n.k);
    return { ...p, k: n.k, x: lerp(p.x, S.x, flat), y: lerp(p.y, S.y, flat), r: lerp(lerp(110, 88, ex(seg(t, 6, 6.42))) * p.s * (n.k < 3 ? 1 : spring(t - 6.5 - (n.k - 3) * .08, 13)), 46, flat) };
  });
  // mesh bağlantıları (düzleşirken uçlardan geri çekilir)
  const lk3 = ex(seg(t, 6.55, 6.95)), back = 1 - ex(seg(t, 7.5, 7.75));
  x.strokeStyle = WH; x.lineWidth = 4; x.lineCap = 'round';
  for (let a = 0; a < P.length; a++) for (let b = a + 1; b < P.length; b++) {
    const A = P[a], B = P[b], old = A.k < 3 && B.k < 3, prog = (old ? 1 : lk3) * back;
    if (prog <= 0) continue;
    const m = (1 - prog) / 2;
    x.beginPath(); x.moveTo(lerp(A.x, B.x, m), lerp(A.y, B.y, m)); x.lineTo(lerp(B.x, A.x, m), lerp(B.y, A.y, m)); x.stroke();
  }
  // derinlik sırasına göre düğümler
  [...P].sort((a, b) => b.z - a.z).forEach(p => {
    disc(p.x, p.y, p.r, NODE_COL[p.k]);
    const ls = p.r / 110; if (ls > .05) { x.save(); x.translate(p.x, p.y); x.scale(ls, ls); text(NODE_L[p.k], 0, 6, 96, BG); x.restore(); }
  });
}

// ---------- 5. ölçü: Tuscord arayüzü (8–10) ----------
const CHANNELS = [['#', 'genel'], ['#', 'borsa'], ['#', 'duyurular']];
const MSGS = [
  { k: 0, name: 'Ayşe', body: 'selam herkes!' },
  { k: 1, name: 'Emre', body: 'akşam sesli odaya gelen var mı?' },
  { k: 2, name: 'Kerem', body: 'varım, ekranımı paylaşıyorum' },
];
function sidebar(t, off = 0) {
  for (let k = 0; k < 6; k++) { const S = SIDE(k); disc(S.x + off, S.y, 46, NODE_COL[k]); x.save(); x.translate(S.x + off, S.y); x.scale(46 / 110, 46 / 110); text(NODE_L[k], 0, 6, 96, BG); x.restore(); }
}
function msgRowY(i) { return 300 + i * 150; }
function bar5(t, off = 0, morph = 0) {
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  sidebar(t, off);
  // kanal paneli
  const pw = 360 * ex(seg(t, 8, 8.3));
  x.fillStyle = '#16181c'; x.fillRect(170 + off, 0, pw, H);
  if (pw > 40) {
    x.save(); x.beginPath(); x.rect(170 + off, 0, pw, H); x.clip();
    text('Tuscord Topluluğu', 200 + off, 110, 32, WH, 800, 'left');
    x.fillStyle = '#2a2d33'; x.fillRect(200 + off, 160, 300, 3);
    CHANNELS.forEach(([h, n], i) => {
      const s = ex(seg(t, 8.12 + i * .06, 8.4 + i * .06)), y = 230 + i * 70 + (1 - s) * 40;
      x.save(); x.beginPath(); x.rect(170 + off, 200 + i * 70, 360, 64); x.clip();
      text(h, 205 + off, y, 34, i === 1 ? TQ : '#8a909c', 800, 'left'); text(n, 245 + off, y, 32, i === 1 ? WH : '#c9ccd2', 500, 'left'); x.restore();
    });
    const s4 = ex(seg(t, 8.3, 8.55)), vy = 470 + (1 - s4) * 40;
    text('SESLİ', 205 + off, 450, 22, '#8a909c', 800, 'left');
    // hoparlör simgesi (şekil)
    x.fillStyle = TQ; x.save(); x.beginPath(); x.rect(170 + off, 470, 360, 70); x.clip();
    x.fillRect(205 + off, vy + 14, 10, 16); x.beginPath(); x.moveTo(215 + off, vy + 14); x.lineTo(229 + off, vy + 4); x.lineTo(229 + off, vy + 40); x.lineTo(215 + off, vy + 30); x.fill();
    text('sohbet-odası', 245 + off, vy + 22, 32, WH, 500, 'left'); x.restore();
    // sesli odaya düşen avatarlar (vuruş 19)
    for (let k = 0; k < 3; k++) {
      const s = spring(t - 9.5 - k * .07, 16); if (s <= 0) continue;
      const ax = 262 + off + k * 70, ay = 560 + (1 - s) * -60;
      disc(ax, ay, 24 * s, NODE_COL[k]);
      if (k === 1 && t > 9.75) { x.strokeStyle = TQ; x.lineWidth = 5; x.beginPath(); x.arc(ax, ay, 32 + 4 * Math.sin((t - 9.75) * 25), 0, 7); x.stroke(); }
    }
    x.restore();
  }
  // mesajlar
  MSGS.forEach((m, i) => {
    const s = spring(t - 8.5 - i * .08, 15); if (s <= 0) return;
    const y = msgRowY(i) + (1 - s) * 260 + off * 0;
    x.save(); x.beginPath(); x.rect(560, 200, 1360, 640); x.clip();
    disc(620 + off * .3, y, 34, NODE_COL[m.k]);
    text(m.name, 680 + off * .3, y - 22, 30, WH, 800, 'left');
    // metin → çubuk dönüşümü (veri ölçüsüne geçiş)
    x.font = F(500, 32); const bw = x.measureText(m.body).width;
    const sq = morph;
    if (sq < 1) { x.save(); x.translate(680, y + 22); x.scale(1, 1 - sq); text(m.body, 0, 0, 32, '#c9ccd2', 500, 'left'); x.restore(); }
    if (sq > 0) { x.fillStyle = NODE_COL[m.k]; rr(680, y + 22 - 17 * sq, bw, 34 * sq, 10); x.fill(); }
    x.restore();
  });
  // tepki rozeti (vuruş 18)
  const rs = spring(t - 9, 18);
  if (rs > 0 && morph < .5) {
    x.save(); x.translate(700 + 140, msgRowY(1) + 78); x.scale(rs, rs);
    x.strokeStyle = TQ; x.lineWidth = 3; rr(-60, -24, 120, 48, 24); x.stroke(); x.fillStyle = '#0f2b28'; x.fill();
    disc(-28, 0, 9, AM); text('+3', 14, 2, 26, WH, 800); x.restore();
  }
  // yazma kutusu + "yazıyor" noktaları (kancaya selam)
  const cs = ex(seg(t, 9, 9.3));
  if (cs > 0 && morph < .5) {
    x.fillStyle = '#16181c'; rr(580, 900, 1280 * cs, 84, 18); x.fill();
    if (cs > .9) { for (let i = 0; i < 3; i++) disc(640 + i * 30, 942 - 10 * Math.max(0, Math.sin(Math.PI * ((t - 9.2) * 4 - i * .45))), 9, TQ); text('Kerem yazıyor', 740, 944, 26, '#8a909c', 500, 'left'); }
  }
}

// ---------- 6. ölçü: veri (10–12) ----------
const ROWS = ['# genel', '# borsa', '# duyurular', 'sohbet-odası'];
const VALS = [[.35, .5, .2, .1], [.55, .7, .3, .45], [.6, .78, .35, .9], [.62, .8, .38, .95]];
function rankY(vals, i) { const order = [...vals.keys()].sort((a, b) => vals[b] - vals[a]); return 290 + order.indexOf(i) * 150; }
function bar6(t) {
  // 10.0'da arayüz sola itilir (kamera sağa kayar), mesaj çubukları grafiğe gider
  const push = exIO(seg(t, 10, 10.3));
  if (push < 1) {
    x.save(); bar5(9.99, -700 * push, 1); x.restore();
  } else { x.fillStyle = BG; x.fillRect(0, 0, W, H); }
  const bi = Math.min(3, Math.floor((t - 10) * 2));
  const prev = VALS[Math.max(0, bi - 1)], cur = VALS[bi], bp = spring(t - 10 - bi * .5, 15);
  const vals = cur.map((v, i) => lerp(bi === 0 ? 0 : prev[i], v, bp));
  const toSlab = ex(seg(t, 11.5, 11.85));
  ROWS.forEach((name, i) => {
    const yA = rankY(bi === 0 ? cur : prev, i), yB = rankY(cur, i), y = lerp(yA, yB, bp);
    const fromMsg = i < 3 ? { x: 680, y: msgRowY(i) + 22 } : { x: 520, y: 740 };
    const arrive = ex(seg(t, 10.05, 10.35));
    const len = lerp(i < 3 ? 420 : 0, 60 + 1000 * vals[i], arrive);
    const bx = lerp(fromMsg.x, 560, arrive), by = lerp(fromMsg.y, y, arrive);

  const cnt = Math.round(1248 * ex(seg(t, 10.5, 11.6)));

// 4 çubuk → 7 dikey levha (TUSCORD harflerinin yandan görünüşü)
const WORD = 'TUSCORD', LSIZE = 330;
function letterLayout() {
  x.font = F(800, LSIZE); x.letterSpacing = '0px';
  const ws = [...WORD].map(c => x.measureText(c).width), gap = 18, tot = ws.reduce((a, b) => a + b, 0) + gap * 6;

}
function slabs(t, p, vals) {
  const L = letterLayout();

}

// ---------- 7. ölçü: en güçlü an — levhalar harfe açılır (12–14) ----------
function word3d(t, collapse = 0, dotPos = null) {

    x.save(); x.translate(px, py); x.scale(sc, sc);

}
function bar7(t) {
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  // 13.5 vuruşu: altta mercan çizgi soldan sağa vurur
  word3d(t);
  const u = ex(seg(t, 13.5, 13.8));
  if (u > 0 && t < 14) { x.fillStyle = CO; x.fillRect(CX - 760, CY + 200, 1520 * u, 12); }
}

// ---------- son yarım ölçü: kapanış başlığı ve döngü (14–15) ----------
function barEnd(t) {
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  const dotTarget = { x: CX, y: CY };
  const col = exIn(seg(t, 14.5, 14.92));
  // mercan çizgi alt yazıya dönüşür: tuscord.com
  const lineOut = ex(seg(t, 14, 14.25));
  if (lineOut < 1) { x.fillStyle = CO; const w = 1520 * (1 - lineOut); x.fillRect(CX + 760 - w, CY + 200, w, 12); }
  x.font = F(800, 64); const domW = x.measureText('tuscord.com').width, dotW = x.measureText('.').width, preW = x.measureText('tuscord').width;
  const dx0 = CX - domW / 2, dy0 = CY + 250;
  const reveal = ex(seg(t, 14.05, 14.35));
  // noktanın konumu: "tuscord.com" içindeki "." → toplanınca merkeze
  const dotHome = { x: dx0 + preW + dotW / 2, y: dy0 + 22 };
  const dp = { x: lerp(dotHome.x, CX, col), y: lerp(dotHome.y, CY, col) };
  word3d(Math.min(t, 14.6), col, dp);

    const yy = dy0 + (1 - reveal) * 90;
    x.save(); x.translate(lerp(dx0, dp.x, col), lerp(yy, dp.y, col)); x.scale(1 - col, 1 - col);
    text('tuscord', 0, 0, 64, WH, 800, 'left'); text('com', preW + dotW, 0, 64, WH, 800, 'left'); x.restore();
    x.restore();
  }
  // nokta: "." hiç kaybolmaz, merkeze gidip ilk karedeki boyutuna gelir
  if (reveal > 0) {
    const r = lerp(8 * reveal, 18, ex(seg(t, 14.6, 14.95)));
    const ry = t < 14.5 ? dotHome.y + (1 - reveal) * 90 : dp.y;

}

function seek(t) {
  t = Math.max(0, Math.min(DUR - 1e-6, t));
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.letterSpacing = '0px';
  if (t < 2) bar1(t);
  else if (t < 3.86 + .3) bar2(t);
  else if (t < 6) bar3(t);
  else if (t < 8) bar4(t);
  else if (t < 10) bar5(t, 0, ex(seg(t, 9.82, 10)));

  else if (t < 14) bar7(t);

window.seek = seek;

// ---------- müzik: OfflineAudioContext → WAV ----------

    bp.type = 'bandpass'; bp.frequency.value = big ? 900 : 1600; bp.Q.value = .8;
    g.gain.setValueAtTime(big ? .9 : .45, t); g.gain.exponentialRampToValueAtTime(.001, t + (big ? .6 : .3));
    s.connect(bp).connect(g).connect(out);
    const o = ctx.createOscillator(), og = ctx.createGain(); o.frequency.setValueAtTime(big ? 110 : 160, t); o.frequency.exponentialRampToValueAtTime(50, t + .4);
    og.gain.setValueAtTime(big ? .8 : .4, t); og.gain.exponentialRampToValueAtTime(.001, t + .5); o.connect(og).connect(out); o.start(t); o.stop(t + .55);
  }

    bp.type = 'bandpass'; bp.Q.value = 3; bp.frequency.setValueAtTime(300, 10); bp.frequency.exponentialRampToValueAtTime(7000, 12);
    g.gain.setValueAtTime(.001, 10); g.gain.exponentialRampToValueAtTime(.6, 11.98); g.gain.linearRampToValueAtTime(0, 12);
    s.connect(bp).connect(g).connect(out);

    og.gain.setValueAtTime(.001, 10); og.gain.exponentialRampToValueAtTime(.12, 11.98); og.gain.linearRampToValueAtTime(0, 12);
    o.connect(og).connect(out); o.start(10); o.stop(12); }

    g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .2); o.connect(g).connect(out); o.start(t); o.stop(t + .22); });

window.renderAudio = renderAudio;
