<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: çentikli ekranlarda güvenli alan değişkenleri çalışsın. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Tuscord — topluluk sohbet platformu" />

    <title>Tuscord</title>

    <!--
      Sosyal medya paylaşım kartı (Open Graph + X/Twitter). Görsel
      scripts/generate-og-image.mjs ile üretildi (bkz. yorumu: X, og:image
      için SVG kabul etmiyor, raster gerekiyor). Mutlak URL şart — göreli
      yol paylaşım kartı tarayıcılarında (X, Discord, WhatsApp vb.) çalışmaz.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tuscord" />
    <meta property="og:title" content="Tuscord" />
    <meta property="og:description" content="Arkadaşlarınla sohbet etmenin en rahat yolu" />
    <meta property="og:url" content="https://tuscord.com" />
    <meta property="og:image" content="https://tuscord.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tuscord" />
    <meta name="twitter:description" content="Arkadaşlarınla sohbet etmenin en rahat yolu" />
    <meta name="twitter:image" content="https://tuscord.com/og-image.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      iOS ana ekran simgesi. PNG bekler; SVG'yi yok sayıp ekran görüntüsü
      kullanır. Gerçek PNG çıktısı hazırlanana kadar bu bilinçli bir eksik.
    -->
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tuscord" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
