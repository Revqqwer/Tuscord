<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: çentikli ekranlarda güvenli alan değişkenleri çalışsın. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Tuscord — topluluk sohbet platformu" />

    <title>Tuscord</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      iOS ana ekran simgesi. PNG bekler; SVG'yi yok sayıp ekran görüntüsü
      kullanır. Gerçek PNG çıktısı hazırlanana kadar bu bilinçli bir eksik.
    -->
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tuscord" />
  </head>
  <body>

    <script type="module" src="/src/main.tsx"></script>
